// camera
let th=-.6,ph=.9,dist=950,tgt=new THREE.Vector3(0,0,0),auto=true,topV=false;
function cam(){CAM.position.set(tgt.x+dist*Math.sin(ph)*Math.sin(th),tgt.y+dist*Math.cos(ph),tgt.z+dist*Math.sin(ph)*Math.cos(th));CAM.lookAt(tgt)}
const ptr=new Map();let moved=0,pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;auto=false;pd=0});
cv.addEventListener('pointerup',e=>{ptr.delete(e.pointerId);if(moved<5)click(e)});
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId),dx=e.clientX-o[0],dy=e.clientY-o[1];
if(ptr.size===2){const o2=[...ptr.entries()].find(q=>q[0]!==e.pointerId)[1],d0=Math.hypot(o[0]-o2[0],o[1]-o2[1]),d1=Math.hypot(e.clientX-o2[0],e.clientY-o2[1]);dist=Math.max(60,Math.min(1800,dist*d0/d1))}
else if(e.buttons&2||e.shiftKey){const k=dist*.0016;tgt.x-=(Math.cos(th)*dx+Math.sin(th)*Math.cos(ph)*dy)*k*-1;tgt.z-=(-Math.sin(th)*dx+Math.cos(th)*Math.cos(ph)*dy)*k*-1}
else{th-=dx*.006;ph=Math.max(.15,Math.min(1.45,ph-dy*.005))}
moved+=Math.abs(dx)+Math.abs(dy);ptr.set(e.pointerId,[e.clientX,e.clientY])});
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(60,Math.min(1800,dist*(1+e.deltaY*.001)));auto=false},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
function click(e){mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,CAM);const h=ray.intersectObjects(pick.filter(m=>m.parent&&m.parent.visible!==false&&(m.parent.parent?m.parent.parent.visible!==false:true)))[0];if(h)showInfo(h.object.userData.s);else{info.style.display='none';cur=null}}
// toggles
let night=true;const bn=document.getElementById('bn');
function theme(){const c=night?[0x0b1020,0x141b2f,0x1a2340,0x4a5470,0x39425a,.45,.8]:[0xcfe6ff,0xe3e9d9,0xf3efe6,0xcfc6b8,0xffffff,.9,1.1];
S.background=new THREE.Color(c[0]);S.fog=new THREE.Fog(c[0],900,2200);ground.material.color.set(c[1]);campus.material.color.set(c[2]);bm.color.set(c[3]);roadMat.color.set(c[4]);lineMat.color.set(night?0x9fb6e8:0xd9a441);lineMat.emissive.set(night?0x9fb6e8:0x000000);amb.intensity=c[5];sun.intensity=c[6];grass.material.color.set(night?0x1c5a3a:0x8fcf8f);document.documentElement.style.setProperty('--bg',night?'#0b1020':'#cfe6ff');bn.textContent=night?'Night':'Day'}
bn.onclick=()=>{night=!night;theme()};theme();
const tg=(id,f)=>{const b=document.getElementById(id);b.onclick=()=>{b.classList.toggle('on');f(b.classList.contains('on'))}};
tg('bt',v=>cg.visible=v);let showL=true;tg('bl',v=>showL=v);
document.getElementById('bv').onclick=()=>{topV=!topV;ph=topV?.15:.9;auto=false;tgt.set(0,0,0);dist=topV?1100:900};
function size(){R.setSize(innerWidth,innerHeight);CAM.aspect=innerWidth/innerHeight;CAM.updateProjectionMatrix()}addEventListener('resize',size);size();
(async()=>{let db=null,user=null,uid=null;
try{if(window.claude){user=await claude.use('user');db=await claude.use('db')}}catch(_){}
if(!db||!user)return;
try{uid=await user.id()}catch(_){return}
if(!uid)return;
const adm=await user.canEdit();
const slug=s=>s.n.replace(/[^A-Za-z0-9]+/g,'-'),esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),byId={};
spots.forEach(s=>byId[slug(s)]=s);
document.querySelector('#hd small').textContent='● Live · shared with all users';
document.querySelector('#lg small').textContent='Pin: green = free · amber = filling · red = full. Live data.';
db.collection('parked').onSnapshot(sn=>{spots.forEach(s=>s.occ=0);let mine=null;sn.docs.forEach(d=>{const x=d.data()||{},s=byId[x.bay];if(s){s.occ=Math.min(s.cap,s.occ+1);if(d.id===uid)mine=s.n}});me=mine;myBar();stats()},()=>{});
info.onclick=async e=>{const b=e.target.closest('button');if(!b||!cur)return;
try{if(b.id==='pk'){await db.doc('parked/'+uid).set({bay:slug(cur),ts:Date.now()});toast('Marked as occupied: '+cur.n)}
else if(b.id==='lv'){await db.doc('parked/'+uid).delete();toast('Thanks! Bay released')}}catch(_){toast('Could not save – you may have view-only access')}};
let first=true;
db.collection('notices').onSnapshot(sn=>{const a=sn.docs.map(d=>({id:d.id,...d.data()})).sort((p,q)=>q.ts-p.ts),had=NO.length;NO.length=0;a.forEach(n=>NO.push([n.title,n.body,n.id]));badge();if($('al').style.display==='block')renderAl();else if(!first&&NO.length>had)toast('🔔 New parking notice');first=false},()=>{});
renderAl=function(){$('al').innerHTML='<h3>Notifications</h3>'+(adm?`<div class='nt'><input id='nt1' placeholder='Title' style='width:100%;margin-bottom:4px'><textarea id='nt2' placeholder='Message' style='width:100%'></textarea><button id='np' style='margin-top:4px'>Post notice</button></div>`:'')+NO.map(n=>`<div class='nt'><b>${esc(n[0])}</b>${adm&&n[2]?` <a data-d='${n[2]}' style='cursor:pointer;color:#ff7b7b'>delete</a>`:''}<span>${esc(n[1])}</span></div>`).join('')};
$('al').onclick=async e=>{const t=e.target;try{if(t.id==='np'){const a=$('nt1').value.trim(),b=$('nt2').value.trim();if(a&&b){await db.collection('notices').add({title:a,body:b,ts:Date.now()});toast('Notice posted')}}else if(t.dataset.d){await db.doc('notices/'+t.dataset.d).delete()}}catch(_){toast('Could not save')}};
})();
const clk=new THREE.Clock(),v3=new THREE.Vector3();
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.1),t=clk.elapsedTime;if(auto)th+=dt*.08;
pins.forEach((p,i)=>{p.position.y=18+Math.sin(t*2+i)*2.5;p.rotation.y=t+i});cg.visible&&cars.forEach(c=>place(c,dt));cam();R.render(S,CAM);
labs.forEach(l=>{v3.copy(l.v).project(CAM);const ok=showL&&v3.z<1&&dist<1100;l.d.style.display=ok?'block':'none';if(ok)l.d.style.transform='translate('+((v3.x*.5+.5)*innerWidth)+'px,'+((-v3.y*.5+.5)*innerHeight)+'px) translate(-50%,-100%)'});
labs.forEach(l=>{l.d.style.left=0;l.d.style.top=0})})();
</script></body></html>
